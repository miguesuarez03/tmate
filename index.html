<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="index, follow" />
    <title>MAbroad — Descubre y compara tu ciudad Erasmus ideal</title>
    <meta name="description" content="Tu guía para elegir ciudad Erasmus: 150 destinos con scores por categoría, comparador y guías locales. Gratis." />

    <!-- Open Graph / Twitter Card — valores por defecto, cada página los
         sobrescribe dinámicamente vía el hook useSEO -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="MAbroad" />
    <meta property="og:locale" content="es_ES" />
    <meta property="og:image" content="https://www.mabroad.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="MAbroad — Descubre y compara tu ciudad Erasmus ideal" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://www.mabroad.com/og-image.png" />
    <meta name="theme-color" content="#2F5073" />

    <!-- Google Fonts: preconnect + link (más rápido que @import en CSS).
         Bricolage Grotesque = UI/navegación/cuerpo/logotipo. Fraunces se
         reserva para titulares editoriales puntuales (hero). -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Fotos de ciudades (imagen LCP de las fichas) -->
    <link rel="preconnect" href="https://upload.wikimedia.org" />
    <link rel="dns-prefetch" href="https://images.unsplash.com" />
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@6..144,200..800&family=Fraunces:ital,wght@0,700;0,800;0,900;1,700&display=swap" rel="stylesheet" />

    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { -webkit-font-smoothing: antialiased; }
    </style>
    <!-- Aplica el tema (localStorage > preferencia del sistema) antes del
         primer paint, para evitar el parpadeo de tema claro→oscuro.
         ⚠ La CSP de vercel.json permite este script por su hash sha256: si
         lo cambias, el build (scripts/prerender.mjs) te dirá el hash nuevo. -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("tmate-theme");
          var theme = stored === "light" || stored === "dark"
            ? stored
            : (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
          document.documentElement.setAttribute("data-theme", theme);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
