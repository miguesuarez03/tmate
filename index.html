<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="index, follow" />
    <title>TMate — Descubre y compara tu ciudad Erasmus ideal</title>
    <meta name="description" content="La guía definitiva para elegir tu ciudad Erasmus. 150 destinos con scores reales, opiniones de estudiantes y guías locales. Totalmente gratis." />

    <!-- Open Graph / Twitter Card — valores por defecto, cada página los
         sobrescribe dinámicamente vía el hook useSEO -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="TMate" />
    <meta property="og:image" content="https://mabroad.com/og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://mabroad.com/og-image.png" />

    <!-- Google Fonts: preconnect + link (más rápido que @import en CSS) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,600;0,700;0,800;0,900;1,700&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet" />

    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { -webkit-font-smoothing: antialiased; }
    </style>
    <!-- Aplica el tema (localStorage > preferencia del sistema) antes del
         primer paint, para evitar el parpadeo de tema claro→oscuro. -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("tmate-theme");
          var theme = stored === "light" || stored === "dark"
            ? stored
            : (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
          document.documentElement.setAttribute("data-theme", theme);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
